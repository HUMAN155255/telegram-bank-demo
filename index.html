<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Bank — DEMO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(145deg, #302d3f, #9189a8);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 560px;
    background: white;
    border-radius: 28px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.title {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #263243;
}

.subtitle {
    text-align: center;
    color: #777;
    margin: 7px 0 25px;
}

label {
    display: block;
    margin-top: 17px;
    margin-bottom: 7px;
    font-size: 14px;
    font-weight: bold;
    color: #68727c;
}

input, select {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid #d8dee6;
    background: #f8f9fb;
    font-size: 17px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 17px;
    border: none;
    border-radius: 15px;
    background: #1c2431;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.note {
    margin-top: 18px;
    text-align: center;
    color: #777;
    font-size: 12px;
    line-height: 1.4;
}
</style>
</head>

<body>

<div class="card">

    <div class="title">Telegram Bank</div>

    <div class="subtitle">Төлемге өтінім — DEMO</div>

    <form id="form">

        <label>БАНК</label>
        <select id="bank" required>
            <option value="">Банкті таңдаңыз</option>
            <option value="Kaspi Bank">Kaspi Bank</option>
            <option value="Halyk Bank">Halyk Bank</option>
        </select>

        <label>АЛУШЫНЫҢ АТЫ</label>
        <input
            id="name"
            type="text"
            placeholder="Demo User"
            value="Demo User"
            required
        >

        <label>ДЕМО НӨМІРІ</label>
        <input
            id="phone"
            type="text"
            value="+7 700 000 00 00"
            readonly
        >

        <label>TELEGRAM USERNAME</label>
        <input
            id="username"
            type="text"
            placeholder="@demo_user"
            value="@demo_user"
            required
        >

        <label>СОМА</label>
        <input
            id="amount"
            type="number"
            min="1"
            placeholder="15000"
            value="15000"
            required
        >

        <button type="submit">
            ЖІБЕРУ
        </button>

    </form>

    <div id="status"></div>

    <div class="note">
        DEMO нұсқасы. Деректер серверге жіберілмейді.
        Нақты жеке деректерді енгізбеңіз.
    </div>

</div>

<script>
const form = document.getElementById("form");
const status = document.getElementById("status");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    const order = {
        bank: document.getElementById("bank").value,
        name: document.getElementById("name").value.trim(),
        phone: document.getElementById("phone").value,
        username: document.getElementById("username").value.trim(),
        amount: document.getElementById("amount").value,
        time: new Date().toLocaleString("kk-KZ")
    };

    const orders =
        JSON.parse(localStorage.getItem("demoOrders") || "[]");

    orders.push(order);

    localStorage.setItem(
        "demoOrders",
        JSON.stringify(orders)
    );

    status.textContent = "✅ Демо-өтінім қабылданды!";

    setTimeout(() => {
        status.textContent = "";
    }, 2500);
});
</script>

</body>
</html>
