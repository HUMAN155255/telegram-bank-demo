<!DOCTYPE html>

<html lang="kk">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Telegram Bank</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 20px;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            145deg,
            #302d3f,
            #9189a8
        );

    display: flex;

    align-items: center;

    justify-content: center;
}


.card {

    width: 100%;

    max-width: 560px;

    background: white;

    border-radius: 28px;

    padding: 28px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.25);
}


.title {

    text-align: center;

    font-size: 30px;

    font-weight: bold;

    color: #263243;

    margin-bottom: 7px;
}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;
}


label {

    display: block;

    margin-top: 17px;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: bold;

    color: #68727c;
}


input,
select {

    width: 100%;

    padding: 16px;

    border-radius: 14px;

    border: 1px solid #d8dee6;

    background: #f8f9fb;

    font-size: 17px;

    outline: none;
}


input:focus,
select:focus {

    border-color: #687386;
}


button {

    width: 100%;

    margin-top: 25px;

    padding: 17px;

    border: none;

    border-radius: 15px;

    background: #1c2431;

    color: white;

    font-size: 18px;

    font-weight: bold;
}


button:disabled {

    opacity: 0.6;
}


#status {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;
}


.note {

    margin-top: 18px;

    text-align: center;

    color: #777;

    font-size: 12px;

    line-height: 1.4;
}

</style>

</head>


<body>


<div class="card">


    <div class="title">
        Telegram Bank
    </div>


    <div class="subtitle">
        Төлемге өтінім
    </div>


    <form id="form">


        <label>
            БАНК
        </label>

        <select
            id="bank"
            required
        >

            <option value="">
                Банкті таңдаңыз
            </option>

            <option value="Kaspi Bank">
                Kaspi Bank
            </option>

            <option value="Halyk Bank">
                Halyk Bank
            </option>

        </select>


        <label>
            АЛУШЫНЫҢ АТЫ
        </label>

        <input
            id="name"
            type="text"
            maxlength="100"
            placeholder="Аты-жөні"
            required
        >


        <label>
            ТЕЛЕФОН НӨМІРІ
        </label>

        <input
            id="phone"
            type="tel"
            maxlength="30"
            placeholder="+7 700 000 00 00"
            required
        >


        <label>
            TELEGRAM USERNAME
        </label>

        <input
            id="username"
            type="text"
            maxlength="50"
            placeholder="@username"
            required
        >


        <label>
            СОМA
        </label>

        <input
            id="amount"
            type="text"
            maxlength="30"
            inputmode="decimal"
            placeholder="15000"
            required
        >


        <button
            id="send"
            type="submit"
        >
            ЖІБЕРУ
        </button>


    </form>


    <div id="status"></div>


    <div class="note">
        DEMO нұсқасы. Карта нөмірі, CVV
        және SMS-код сұралмайды.
    </div>


</div>


<script>

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


const form =
    document.getElementById("form");

const button =
    document.getElementById("send");

const status =
    document.getElementById("status");


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        button.disabled = true;

        status.textContent =
            "Жіберілуде...";


        const data = {

            bank:
                document
                .getElementById("bank")
                .value,

            name:
                document
                .getElementById("name")
                .value
                .trim(),

            phone:
                document
                .getElementById("phone")
                .value
                .trim(),

            username:
                document
                .getElementById("username")
                .value
                .trim(),

            amount:
                document
                .getElementById("amount")
                .value
                .trim()

        };


        try {

            const response =
                await fetch(
                    "/submit",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );


            const result =
                await response.json();


            if (!result.ok) {

                throw new Error(
                    result.error ||
                    "Қате орын алды"
                );

            }


            status.textContent =
                "✅ Өтінім қабылданды!";


            if (
                tg.HapticFeedback
            ) {

                tg.HapticFeedback
                    .notificationOccurred(
                        "success"
                    );

            }


        } catch (error) {

            status.textContent =
                "❌ " + error.message;

            button.disabled = false;

        }

    }
);

</script>


</body>

</html>
