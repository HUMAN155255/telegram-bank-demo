<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Demo Admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.container {
    max-width: 700px;
    margin: auto;
}

h1 {
    color: #202733;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #202733;
    color: white;
    font-weight: bold;
}

.delete {
    background: #b42318;
}

.order {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.row {
    margin: 9px 0;
}

.label {
    font-weight: bold;
    color: #667085;
}

.empty {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    color: #777;
}
</style>
</head>

<body>

<div class="container">

    <h1>📋 Demo өтінімдер</h1>

    <div class="buttons">
        <button onclick="loadOrders()">
            🔄 Жаңарту
        </button>

        <button class="delete" onclick="clearOrders()">
            🗑 Өшіру
        </button>
    </div>

    <div id="orders"></div>

</div>

<script>

function loadOrders() {

    const orders =
        JSON.parse(
            localStorage.getItem("demoOrders") || "[]"
        );

    const container =
        document.getElementById("orders");

    if (orders.length === 0) {

        container.innerHTML =
            '<div class="empty">' +
            'Әзірге демо өтінім жоқ' +
            '</div>';

        return;
    }

    container.innerHTML = "";

    orders
        .slice()
        .reverse()
        .forEach(order => {

            const div =
                document.createElement("div");

            div.className = "order";

            div.innerHTML = `
                <div class="row">
                    <span class="label">🏦 Банк:</span>
                    ${safe(order.bank)}
                </div>

                <div class="row">
                    <span class="label">👤 Аты:</span>
                    ${safe(order.name)}
                </div>

                <div class="row">
                    <span class="label">📱 Демо нөмірі:</span>
                    ${safe(order.phone)}
                </div>

                <div class="row">
                    <span class="label">🔗 Username:</span>
                    ${safe(order.username)}
                </div>

                <div class="row">
                    <span class="label">💰 Сома:</span>
                    ${safe(order.amount)} ₸
                </div>

                <div class="row">
                    <span class="label">🕐 Уақыт:</span>
                    ${safe(order.time)}
                </div>
            `;

            container.appendChild(div);
        });
}


function safe(value) {

    const element =
        document.createElement("div");

    element.textContent =
        value ?? "";

    return element.innerHTML;
}


function clearOrders() {

    if (
        confirm(
            "Барлық DEMO өтінімдерді өшіру керек пе?"
        )
    ) {

        localStorage.removeItem("demoOrders");

        loadOrders();
    }
}


loadOrders();

</script>

</body>
  </html>
