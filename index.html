<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Bank — DEMO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#e9edf3;
}
.card {
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:22px;
}
h1 { text-align:center; }
label {
    display:block;
    margin-top:15px;
    font-weight:bold;
}
input,select,button {
    width:100%;
    padding:14px;
    margin-top:7px;
    box-sizing:border-box;
    border-radius:12px;
    border:1px solid #ccc;
    font-size:16px;
}
button {
    margin-top:22px;
    background:#222;
    color:white;
    border:0;
}
#status {
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>Telegram Bank</h1>
<p style="text-align:center">Қауіпсіз DEMO</p>

<form id="form">

<label>Банк</label>
<select id="bank" required>
    <option value="">Таңдаңыз</option>
    <option>Kaspi Bank</option>
    <option>Halyk Bank</option>
</select>

<label>Аты</label>
<input id="name" value="Demo User" required>

<label>Телефон</label>
<input id="phone" value="+7 700 000 00 00" required>

<label>Telegram username</label>
<input id="username" value="@demo_user" required>

<label>Сома</label>
<input id="amount" type="number" value="15000" required>

<button type="submit">ЖІБЕРУ</button>

</form>

<div id="status"></div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

document.getElementById("form").addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {
        bank: document.getElementById("bank").value,
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        username: document.getElementById("username").value,
        amount: document.getElementById("amount").value
    };

    document.getElementById("status").textContent =
        "⏳ Жіберілуде...";

    try {

        const response = await fetch(
            "https://СЕНІҢ-FLASK-АДРЕСІҢ/submit",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        if (result.ok) {
            document.getElementById("status").textContent =
                "✅ DEMO өтінім жіберілді!";
        } else {
            document.getElementById("status").textContent =
                "❌ " + result.error;
        }

    } catch (error) {

        document.getElementById("status").textContent =
            "❌ Серверге қосылу мүмкін емес";
    }
});
</script>

</body>
</html>
